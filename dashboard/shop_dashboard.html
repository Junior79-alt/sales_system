<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#f0f2f5; padding:15px; }
        .container { max-width:1000px; margin:0 auto; }

        /* ===== HEADER ===== */
        header {
            background:linear-gradient(135deg,#2e7d32,#1b5e20);
            color:white; padding:15px 20px; border-radius:12px;
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:20px; flex-wrap:wrap; gap:10px;
        }
        header h1 { font-size:20px; }
        .logout-btn { background:#d32f2f; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; }
        .logout-btn:hover { background:#b71c1c; }
        .user-info { color:white; margin-right:15px; font-weight:500; }

        /* ===== CARD ===== */
        .card {
            background:white; padding:20px; border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:20px;
        }
        .card h2 { color:#2e7d32; font-size:18px; margin-bottom:12px; }

        /* ===== FORM ===== */
        .form-group { margin-bottom:12px; }
        .form-group label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:4px; }
        .form-group input {
            width:100%; padding:10px 14px; border:1px solid #ddd;
            border-radius:8px; font-size:15px; transition:border-color 0.3s;
        }
        .form-group input:focus {
            border-color:#2e7d32; outline:none;
            box-shadow:0 0 0 3px rgba(46,125,50,0.1);
        }
        .btn-submit {
            padding:12px; background:#2e7d32; color:white; border:none;
            border-radius:8px; width:100%; font-size:16px;
            font-weight:bold; cursor:pointer; margin-top:8px;
            transition:background 0.3s;
        }
        .btn-submit:hover { background:#1b5e20; }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; }

        .msg { padding:10px; border-radius:6px; margin-top:10px; display:none; font-size:14px; font-weight:bold; }
        .msg.success { display:block; background:#c8e6c9; color:#1b5e20; }
        .msg.error { display:block; background:#ffcdd2; color:#b71c1c; }

        /* ===== STATS ===== */
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:15px; }
        .stat-box { background:#e8f5e9; padding:15px; border-radius:8px; text-align:center; }
        .stat-box .label { font-size:12px; color:#666; text-transform:uppercase; font-weight:600; }
        .stat-box .value { font-size:22px; font-weight:bold; color:#2e7d32; margin-top:5px; }

        /* ===== TABLE ===== */
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:12px; min-width:600px; }
        th { background:#2e7d32; color:white; padding:8px 10px; text-align:left; font-size:11px; white-space:nowrap; }
        td { padding:6px 10px; border-bottom:1px solid #eee; font-size:12px; }
        tr:hover { background:#f5f5f5; }
        .no-data { text-align:center; padding:30px; color:#999; font-size:14px; }

        /* ===== RESPONSIVE ===== */
        @media (max-width:768px) {
            header { flex-direction:column; text-align:center; }
            .stats-grid { grid-template-columns:repeat(2,1fr); }
            table { font-size:11px; min-width:500px; }
            th, td { padding:5px 8px; }
        }
        @media (max-width:480px) {
            body { padding:10px; }
            header h1 { font-size:17px; }
            .card { padding:15px; }
            .stats-grid { grid-template-columns:1fr; }
            .stat-box .value { font-size:18px; }
            table { font-size:10px; min-width:400px; }
            th, td { padding:4px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏪 SHOP DASHBOARD</h1>
            <div>
                <span class="user-info" id="staffName">Shop</span>
                <button onclick="logout()" class="logout-btn">Toka</button>
            </div>
        </header>

        <!-- ADD SALE -->
        <div class="card">
            <h2>➕ Ongeza Mauzo</h2>
            <div class="form-group">
                <label>Jina la Bidhaa</label>
                <input type="text" id="productName" placeholder="Mfano: Sukari, Mchele, n.k.">
            </div>
            <div class="form-group">
                <label>Idadi</label>
                <input type="number" id="quantity" placeholder="Idadi" min="1">
            </div>
            <div class="form-group">
                <label>Bei (TSh)</label>
                <input type="number" id="price" placeholder="Bei kwa kila bidhaa" min="1" step="0.01">
            </div>
            <button class="btn-submit" id="saleBtn" onclick="addSale()">💾 HIFADHI MAUZO</button>
            <div id="saleMsg" class="msg"></div>
        </div>

        <!-- SUMMARY -->
        <div class="card">
            <h2>📊 Muhtasari Wangu</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">Jumla Mauzo</div>
                    <div class="value" id="totalSales">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Bidhaa</div>
                    <div class="value" id="totalQty">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Idadi ya Mauzo</div>
                    <div class="value" id="totalCount">0</div>
                </div>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="card">
            <h2>📋 Historia ya Mauzo</h2>
            <div class="table-wrapper">
                <div id="history"><p class="no-data">Loading...</p></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) window.location.href = 'login.html';

        // ============ HELPERS ============
        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function fmt(n) {
            return (n || 0).toLocaleString('sw-TZ');
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userRole');
            localStorage.removeItem('staffType');
            window.location.href = 'login.html';
        }

        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API_URL}${path}`, {
                ...options,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    ...(options.headers || {})
                }
            });
            if (res.status === 401) { logout(); return null; }
            return res;
        }

        // ============ ADD SALE ============
        async function addSale() {
            const productName = document.getElementById('productName').value.trim();
            const quantity = parseInt(document.getElementById('quantity').value);
            const price = parseFloat(document.getElementById('price').value);
            const msg = document.getElementById('saleMsg');
            const btn = document.getElementById('saleBtn');

            if (!productName) {
                showMsg(msg, '❌ Ingiza jina la bidhaa!', 'error');
                return;
            }
            if (!quantity || quantity <= 0) {
                showMsg(msg, '❌ Ingiza idadi sahihi!', 'error');
                return;
            }
            if (!price || price <= 0) {
                showMsg(msg, '❌ Ingiza bei sahihi!', 'error');
                return;
            }

            btn.disabled = true;
            showMsg(msg, '⏳ Inahifadhi...', 'success');

            try {
                const params = new URLSearchParams({
                    product_name: productName,
                    quantity: quantity,
                    price: price
                }).toString();
                const res = await apiFetch(`/sales/?${params}`, { method: 'POST' });
                if (!res) return;
                const data = await res.json();

                if (res.ok) {
                    showMsg(msg, `✅ Mauzo yamehifadhiwa! Jumla: ${fmt(data.total_amount)} TSh`, 'success');
                    document.getElementById('productName').value = '';
                    document.getElementById('quantity').value = '';
                    document.getElementById('price').value = '';
                    loadData();
                } else {
                    showMsg(msg, '❌ ' + (data.detail || 'Failed'), 'error');
                }
            } catch (e) {
                showMsg(msg, '❌ Error: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // ============ LOAD DATA ============
        async function loadData() {
            try {
                const res = await apiFetch('/agent/my_data');
                if (!res) return;
                if (!res.ok) {
                    if (res.status === 403) { window.location.href = 'agent_dashboard.html'; return; }
                    throw new Error('Failed');
                }
                const d = await res.json();

                document.getElementById('staffName').textContent = d.staff_name || 'Shop';
                document.getElementById('totalSales').textContent = fmt(d.total_sales);
                document.getElementById('totalQty').textContent = d.total_quantity || 0;
                document.getElementById('totalCount').textContent = d.sales_count || 0;

                const c = document.getElementById('history');
                if (!d.sales || d.sales.length === 0) {
                    c.innerHTML = '<p class="no-data">Hakuna mauzo bado</p>';
                    return;
                }

                let html = `<table>
                    <thead>
                        <tr>
                            <th>#</th><th>Bidhaa</th><th>Idadi</th><th>Bei</th><th>Jumla</th><th>Tarehe</th>
                        </tr>
                    </thead>
                    <tbody>`;

                d.sales.forEach((s, i) => {
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td>${escapeHtml(s.product_name)}</td>
                        <td>${s.quantity}</td>
                        <td>${fmt(s.price)} TSh</td>
                        <td><strong style="color:#2e7d32;">${fmt(s.total_amount)} TSh</strong></td>
                        <td>${escapeHtml(s.date)}</td>
                    </tr>`;
                });

                html += '</tbody></table>';
                c.innerHTML = html;
            } catch (e) {
                console.error(e);
                document.getElementById('history').innerHTML = '<p class="no-data" style="color:red;">❌ Error loading data</p>';
            }
        }

        // ============ INIT ============
        async function init() {
            try {
                const res = await apiFetch('/users/me');
                if (!res) return;
                if (!res.ok) { window.location.href = 'login.html'; return; }
                const user = await res.json();
                if (user.staff_type !== 'shop') {
                    if (user.staff_type === 'agent') { window.location.href = 'agent_dashboard.html'; return; }
                    if (user.role === 'admin') { window.location.href = 'index.html'; return; }
                }
                loadData();
            } catch (e) {
                console.error('Init error:', e);
                window.location.href = 'login.html';
            }
        }

        init();

        const refreshInterval = setInterval(loadData, 30000);
        window.addEventListener('beforeunload', () => clearInterval(refreshInterval));
    </script>
</body>
</html>
