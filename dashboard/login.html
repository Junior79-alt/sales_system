<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sales System</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        html,body {
            min-height:100vh; height:100vh; width:100%; overflow:hidden;
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
            display:flex; justify-content:center; align-items:center;
            position:fixed; top:0; left:0;
        }

        .circle { position:fixed; border-radius:50%; pointer-events:none; opacity:0.15; }
        .circle-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(108,92,231,0.5),transparent 70%); top:-200px; right:-100px; }
        .circle-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(255,107,107,0.3),transparent 70%); bottom:-150px; left:-100px; }
        .circle-3 { width:200px; height:200px; background:radial-gradient(circle,rgba(255,217,61,0.2),transparent 70%); top:50%; left:50%; transform:translate(-50%,-50%); }

        .glass-card {
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border-radius:24px;
            padding:45px 40px 35px 40px;
            width:100%;
            max-width:420px;
            box-shadow:0 8px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.1);
            border:1px solid rgba(255,255,255,0.08);
            position:relative;
            z-index:10;
            margin:20px;
        }

        .logo { text-align:center; margin-bottom:5px; }
        .logo span { font-size:52px; display:block; }

        .glass-card h1 {
            text-align:center;
            color:#ffffff;
            font-size:28px;
            font-weight:700;
            margin-bottom:3px;
            text-shadow:0 2px 10px rgba(0,0,0,0.2);
            letter-spacing:0.5px;
        }
        .glass-card .subtitle {
            text-align:center;
            color:rgba(255,255,255,0.6);
            font-size:14px;
            margin-bottom:28px;
            font-weight:300;
            letter-spacing:0.5px;
        }

        .glass-card input {
            width:100%;
            padding:14px 18px;
            margin:6px 0;
            background:rgba(0,0,0,0.4) !important;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:12px;
            font-size:16px;
            color:#ffffff !important;
            box-sizing:border-box;
            transition:all 0.3s ease;
            outline:none;
        }
        .glass-card input::placeholder { color:rgba(255,255,255,0.5); font-weight:300; }
        .glass-card input:focus {
            border-color:rgba(255,255,255,0.4);
            background:rgba(0,0,0,0.5) !important;
            box-shadow:0 0 20px rgba(255,255,255,0.03);
        }
        .glass-card input:-webkit-autofill {
            -webkit-box-shadow:0 0 0 30px rgba(0,0,0,0.5) inset !important;
            -webkit-text-fill-color:#ffffff !important;
            border-color:rgba(255,255,255,0.2);
        }

        .forgot-link { text-align:right; margin-top:2px; margin-bottom:18px; }
        .forgot-link a {
            color:rgba(255,255,255,0.5);
            text-decoration:none;
            font-size:13px;
            transition:color 0.3s ease;
            font-weight:300;
        }
        .forgot-link a:hover { color:rgba(255,255,255,0.9); text-decoration:underline; }

        .login-btn {
            width:100%;
            padding:14px;
            background:linear-gradient(135deg,rgba(255,255,255,0.9),rgba(255,255,255,0.7));
            color:#1a1a2e;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
            margin-top:5px;
            transition:all 0.3s ease;
            box-shadow:0 4px 20px rgba(0,0,0,0.15);
            letter-spacing:0.5px;
        }
        .login-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.25); background:linear-gradient(135deg,#ffffff,rgba(255,255,255,0.85)); }
        .login-btn:active { transform:translateY(0px); }
        .login-btn:disabled { opacity:0.6; cursor:not-allowed; }

        .msg {
            text-align:center;
            margin-top:12px;
            font-size:14px;
            min-height:22px;
            font-weight:500;
            padding:10px 14px;
            border-radius:10px;
            display:none;
        }
        .msg.error { display:block; color:#ff6b6b; background:rgba(255,107,107,0.12); border:1px solid rgba(255,107,107,0.15); }
        .msg.success { display:block; color:#51cf66; background:rgba(81,207,102,0.12); border:1px solid rgba(81,207,102,0.15); }
        .msg.info { display:block; color:#74c0fc; background:rgba(116,192,252,0.12); border:1px solid rgba(116,192,252,0.15); }

        .divider { display:flex; align-items:center; margin:20px 0 16px 0; }
        .divider hr { flex:1; border:none; border-top:1px solid rgba(255,255,255,0.08); }
        .divider span { padding:0 16px; color:rgba(255,255,255,0.3); font-size:13px; font-weight:300; }

        .register-link { text-align:center; margin-top:14px; font-size:14px; color:rgba(255,255,255,0.5); }
        .register-link a { color:#ffffff; text-decoration:none; }
        .register-link a:hover { text-decoration:underline; }

        /* 2FA */
        #twoFA { display:none; }
        #totpCode { text-align:center; font-size:24px; letter-spacing:8px; padding:16px; }

        /* RESET PASSWORD MODAL */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); z-index:99999;
            justify-content:center; align-items:center;
            padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:linear-gradient(135deg,#1a1a2e,#16213e);
            border-radius:16px; padding:0;
            max-width:420px; width:100%;
            box-shadow:0 10px 50px rgba(0,0,0,0.5);
            overflow:hidden;
            animation:modalFadeIn 0.2s ease;
            border:1px solid rgba(255,255,255,0.1);
        }
        @keyframes modalFadeIn {
            from { opacity:0; transform:scale(0.95); }
            to { opacity:1; transform:scale(1); }
        }
        .modal-header {
            background:linear-gradient(135deg,#1a237e,#0d47a1);
            color:white; padding:18px 24px;
            display:flex; align-items:center; gap:12px;
        }
        .modal-header h3 { margin:0; font-size:18px; font-weight:600; }
        .modal-body { padding:24px; }
        .modal-body p { margin:0 0 15px 0; font-size:14px; color:rgba(255,255,255,0.8); line-height:1.5; }
        .modal-body label {
            display:block; color:rgba(255,255,255,0.7);
            font-size:12px; font-weight:600; margin-bottom:6px;
            text-transform:uppercase; letter-spacing:0.5px;
        }
        .modal-body input {
            width:100%; padding:12px 16px;
            background:rgba(0,0,0,0.4) !important;
            border:1px solid rgba(255,255,255,0.15);
            border-radius:10px; font-size:15px;
            color:#ffffff !important;
            outline:none; margin-bottom:12px;
        }
        .modal-body input:focus {
            border-color:rgba(255,255,255,0.4);
            background:rgba(0,0,0,0.5) !important;
        }
        .modal-footer {
            padding:16px 24px; background:rgba(0,0,0,0.2);
            display:flex; justify-content:flex-end; gap:10px;
        }
        .modal-btn {
            padding:10px 20px; border:none; border-radius:8px;
            cursor:pointer; font-size:14px; font-weight:600;
        }
        .modal-btn.cancel { background:rgba(255,255,255,0.15); color:white; }
        .modal-btn.cancel:hover { background:rgba(255,255,255,0.25); }
        .modal-btn.ok { background:#2e7d32; color:white; }
        .modal-btn.ok:hover { background:#1b5e20; }
        .modal-btn.ok:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
</head>
<body>
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <div class="glass-card">
        <h1>SALES SYSTEM</h1>
        <p class="subtitle">KARIBU</p>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <input type="email" id="email" placeholder="Email" autocomplete="username">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <div class="forgot-link">
                <a href="#" onclick="forgot(); return false;">Umesahau password?</a>
            </div>
            <button id="loginBtn" class="login-btn" onclick="login()">INGIA</button>
            <div id="msg" class="msg"></div>
        </div>

        <!-- 2FA FORM -->
        <div id="twoFA">
            <p style="color:white; text-align:center; margin-bottom:10px;">Ingiza 2FA code kutoka app yako</p>
            <input type="text" id="totpCode" placeholder="000000" maxlength="6" pattern="[0-9]{6}">
            <button class="login-btn" onclick="verify2FA()" style="margin-top:10px;">THIBITISHA</button>
            <div id="msg2fa" class="msg"></div>
        </div>

        <div class="divider"><hr><span>AU</span><hr></div>
        <div class="register-link">
            Huna akaunti? <a href="register.html">Jisajili hapa</a>
        </div>
    </div>

    <!-- ===== RESET PASSWORD MODAL ===== -->
    <div class="modal-overlay" id="resetModal">
        <div class="modal-box">
            <div class="modal-header">
                <span style="font-size:24px;">🔑</span>
                <h3>Badilisha Password</h3>
            </div>
            <div class="modal-body">
                <p>Umepokea <strong>password ya kianzio</strong> kwa email. Sasa ingiza password hiyo na password mpya unayotaka.</p>
                <label>Email Yako</label>
                <input type="email" id="resetEmail" placeholder="Email yako" readonly style="opacity:0.6;">
                <label>Password ya Kianzio</label>
                <input type="text" id="resetOldPassword" placeholder="Password uliyopokea kwa email" autocomplete="off">
                <label>Password Mpya</label>
                <input type="password" id="resetNewPassword" placeholder="Password mpya (min 8 chars, A-Z, a-z, 0-9)" autocomplete="new-password">
                <label>Rudia Password Mpya</label>
                <input type="password" id="resetConfirmPassword" placeholder="Rudia password mpya" autocomplete="new-password">
                <div id="resetMsg" class="msg" style="text-align:center;"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeResetModal()">Ghairi</button>
                <button class="modal-btn ok" id="resetSubmitBtn" onclick="submitResetPassword()">Badilisha</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        let pendingUserId = null;

        function showMsg(text, type, elId = 'msg') {
            const el = document.getElementById(elId);
            el.textContent = text;
            el.className = 'msg ' + type;
        }

        // =========================================================
        // LOGIN
        // =========================================================
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showMsg('Jaza email na password!', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Inaingia...';

            try {
                const res = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Basic ' + btoa(email + ':' + password) }
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg(data.detail || 'Login failed', 'error');
                    btn.disabled = false;
                    btn.textContent = 'INGIA';
                    return;
                }

                // 2FA
                if (data.requires_2fa) {
                    pendingUserId = data.user_id;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('twoFA').style.display = 'block';
                    document.getElementById('totpCode').focus();
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userRole', data.role);
                localStorage.setItem('staffType', data.staff_type);
                localStorage.setItem('userId', data.user_id);

                showMsg('Umeingia! Inaelekeza...', 'success');

                setTimeout(() => {
                    if (data.role === 'admin') window.location.href = 'index.html';
                    else if (data.staff_type === 'agent') window.location.href = 'agent_dashboard.html';
                    else window.location.href = 'shop_dashboard.html';
                }, 500);
            } catch (e) {
                showMsg('Error: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'INGIA';
            }
        }

        // =========================================================
        // FORGOT PASSWORD → Tuma password ya kianzio kwa email
        // =========================================================
        async function forgot() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMsg('Ingiza email yako kwanza!', 'error');
                return;
            }
            showMsg('⏳ Inatuma password ya kianzio...', 'info');
            try {
                const res = await fetch(`${API_URL}/users/forgot_password?email=${encodeURIComponent(email)}`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showMsg('✅ ' + data.message, 'success');
                    // ✅ Fungua modal ya kubadilisha password
                    openResetModal(email);
                } else {
                    showMsg('❌ ' + (data.detail || 'Failed'), 'error');
                }
            } catch (e) {
                showMsg('❌ Error: ' + e.message, 'error');
            }
        }

        // =========================================================
        // RESET PASSWORD MODAL
        // =========================================================
        function openResetModal(email) {
            document.getElementById('resetEmail').value = email;
            document.getElementById('resetOldPassword').value = '';
            document.getElementById('resetNewPassword').value = '';
            document.getElementById('resetConfirmPassword').value = '';
            document.getElementById('resetMsg').className = 'msg';
            document.getElementById('resetMsg').textContent = '';
            document.getElementById('resetSubmitBtn').disabled = false;
            document.getElementById('resetSubmitBtn').textContent = 'Badilisha';
            document.getElementById('resetModal').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.remove('active');
        }

        async function submitResetPassword() {
            const email = document.getElementById('resetEmail').value;
            const oldPassword = document.getElementById('resetOldPassword').value;
            const newPassword = document.getElementById('resetNewPassword').value;
            const confirmPassword = document.getElementById('resetConfirmPassword').value;
            const btn = document.getElementById('resetSubmitBtn');

            if (!oldPassword) {
                showMsg('❌ Ingiza password ya kianzio!', 'error', 'resetMsg');
                return;
            }
            if (newPassword.length < 8) {
                showMsg('❌ Password mpya iwe angalau herufi 8!', 'error', 'resetMsg');
                return;
            }
            if (!/[A-Z]/.test(newPassword)) {
                showMsg('❌ Password mpya iwe na herufi kubwa (A-Z)!', 'error', 'resetMsg');
                return;
            }
            if (!/[a-z]/.test(newPassword)) {
                showMsg('❌ Password mpya iwe na herufi ndogo (a-z)!', 'error', 'resetMsg');
                return;
            }
            if (!/\d/.test(newPassword)) {
                showMsg('❌ Password mpya iwe na nambari (0-9)!', 'error', 'resetMsg');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMsg('❌ Password mpya hazifanani!', 'error', 'resetMsg');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Inabadilisha...';
            showMsg('⏳ Inabadilisha password...', 'info', 'resetMsg');

            try {
                const params = new URLSearchParams({
                    email: email,
                    old_password: oldPassword,
                    new_password: newPassword,
                }).toString();

                const res = await fetch(`${API_URL}/users/reset_password?${params}`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    showMsg('✅ ' + data.message, 'success', 'resetMsg');
                    // ✅ Jaza email + password mpya kwenye login form
                    document.getElementById('email').value = email;
                    document.getElementById('password').value = newPassword;
                    // Funga modal baada ya sekunde 2
                    setTimeout(() => {
                        closeResetModal();
                        showMsg('✅ Sasa unaweza kuingia na password mpya!', 'success');
                    }, 1500);
                } else {
                    showMsg('❌ ' + (data.detail || 'Failed'), 'error', 'resetMsg');
                    btn.disabled = false;
                    btn.textContent = 'Badilisha';
                }
            } catch (e) {
                showMsg('❌ Error: ' + e.message, 'error', 'resetMsg');
                btn.disabled = false;
                btn.textContent = 'Badilisha';
            }
        }

        // =========================================================
        // 2FA
        // =========================================================
        async function verify2FA() {
            const code = document.getElementById('totpCode').value.trim();
            if (!/^\d{6}$/.test(code)) {
                showMsg('Ingiza code ya tarakimu 6', 'error', 'msg2fa');
                return;
            }
            showMsg('2FA inahitaji setup kamili', 'info', 'msg2fa');
        }

        // =========================================================
        // ENTER KEY SUPPORT
        // =========================================================
        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('totpCode').addEventListener('keydown', e => {
            if (e.key === 'Enter') verify2FA();
        });
        document.getElementById('resetConfirmPassword').addEventListener('keydown', e => {
            if (e.key === 'Enter') submitResetPassword();
        });

        // Close modal on overlay click
        document.getElementById('resetModal').addEventListener('click', (e) => {
            if (e.target.id === 'resetModal') closeResetModal();
        });
        // Close modal on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('resetModal').classList.contains('active')) {
                closeResetModal();
            }
        });

        // PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/dashboard/service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
