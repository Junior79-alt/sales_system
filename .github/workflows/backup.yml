name: Database Backup

on:
  schedule:
    - cron: '0 6 * * *'  # Inaendesha kila siku saa 6:00 AM
  workflow_dispatch:      # Inaweza kuendeshwa manually

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PostgreSQL client version 18
        run: |
          # Ongeza repository ya PostgreSQL 18
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          
          # Ongeza signing key
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          
          # Update na install PostgreSQL 18 client
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          
          # Thibitisha version
          pg_dump --version

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary

      - name: Run backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          # Hakikisha inatumia pg_dump 18
          which pg_dump
          pg_dump --version
          python backup.py

      - name: Upload backup to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backups/*.sql.gz
          retention-days: 30