services:
  # ===== WEB SERVICE =====
  - type: web
    name: sales-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sales_db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

  # ===== CRON: DAILY BACKUP + AUTO INVOICE =====
  - type: cron
    name: daily-backup-invoice
    runtime: python
    plan: free
    schedule: "0 6 * * *"  # 6:00 AM UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python backup.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales_db
          property: connectionString
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sales_db
    databaseName: sales_db
    plan: free